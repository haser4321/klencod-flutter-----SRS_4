
- name: Build APK
  run: |
    echo "===== MANIFEST CONTENT ====="
    cat -n android/app/src/main/AndroidManifest.xml

    echo "===== XML VALIDATION ====="
    python3 - <<'PY'
    import xml.etree.ElementTree as ET

    path = "android/app/src/main/AndroidManifest.xml"

    try:
        ET.parse(path)
        print("XML_VALIDATION_OK")
    except ET.ParseError as e:
        print("XML_VALIDATION_FAILED")
        print("DETAIL:", e)
        raise
    PY

    echo "===== GRADLE MANIFEST DEBUG ====="
    cd android
    ./gradlew :app:processReleaseMainManifest --stacktrace --info
    
